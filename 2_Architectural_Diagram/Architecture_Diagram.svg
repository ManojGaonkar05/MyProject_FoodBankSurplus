<rect x="55" y="420" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="147.5" y="442.0" font-size="11.5" text-anchor="middle">Reservation Service</text>
<text x="147.5" y="458.0" font-size="11.5" text-anchor="middle">UC-03 + UC-06 eligibility</text>
<rect x="255" y="420" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="347.5" y="442.0" font-size="11.5" text-anchor="middle">Pickup Verification</text>
<text x="347.5" y="458.0" font-size="11.5" text-anchor="middle">UC-04 unique code</text>
<rect x="455" y="420" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="547.5" y="442.0" font-size="11.5" text-anchor="middle">Reporting Service</text>
<text x="547.5" y="458.0" font-size="11.5" text-anchor="middle">UC-05 monthly report</text>
<rect x="655" y="420" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="747.5" y="442.0" font-size="11.5" text-anchor="middle">Expiry Scheduler</text>
<text x="747.5" y="458.0" font-size="11.5" text-anchor="middle">deactivate expired batches</text>
<text x="55" y="494" font-size="11" fill="#555">Business rules enforced here: only verified users act; expired food cannot be reserved; one batch = one reservation; codes unique.</text>
<line x1="450" y1="503" x2="450" y2="528" stroke="#333" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="458" y="506.5" width="107.2" height="16" fill="#fff"/><text x="462" y="518.5" font-size="11" font-style="italic">Mongoose queries</text>
<rect x="40" y="528" width="820" height="100" rx="8" fill="#f3ecf8" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="52" y="547" font-size="13" font-weight="bold" fill="#1d3f66">4. DATA LAYER – MongoDB (with 2dsphere geo-index for 5 km search)</text>
<rect x="55" y="560" width="145" height="44" rx="6" fill="#fff" stroke="#6b3d8f" stroke-width="1.5"/>
<text x="127.5" y="586.0" font-size="12" text-anchor="middle">users</text>
