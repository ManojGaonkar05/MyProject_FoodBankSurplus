<rect x="458" y="306.5" width="138.20000000000002" height="16" fill="#fff"/><text x="462" y="318.5" font-size="11" font-style="italic">calls service modules</text>
<rect x="40" y="328" width="820" height="175" rx="8" fill="#fdf1e6" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="52" y="347" font-size="13" font-weight="bold" fill="#1d3f66">3. BUSINESS LOGIC LAYER – service modules</text>
<rect x="55" y="352" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="147.5" y="374.0" font-size="11.5" text-anchor="middle">Auth &amp; User Service</text>
<text x="147.5" y="390.0" font-size="11.5" text-anchor="middle">register, login, verify</text>
<rect x="255" y="352" width="185" height="52" rx="6" fill="#fff" stroke="#b05f0f" stroke-width="1.5"/>
<text x="347.5" y="374.0" font-size="11.5" text-anchor="middle">Food Listing Service</text>
