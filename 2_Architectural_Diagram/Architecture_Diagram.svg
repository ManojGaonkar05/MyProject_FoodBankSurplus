<text x="447.5" y="586.0" font-size="12" text-anchor="middle">foodBatches</text>
<rect x="535" y="560" width="145" height="44" rx="6" fill="#fff" stroke="#6b3d8f" stroke-width="1.5"/>
<text x="607.5" y="586.0" font-size="12" text-anchor="middle">reservations</text>
<rect x="695" y="560" width="145" height="44" rx="6" fill="#fff" stroke="#6b3d8f" stroke-width="1.5"/>
<text x="767.5" y="586.0" font-size="12" text-anchor="middle">notifications</text>
<rect x="890" y="328" width="200" height="175" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="902" y="347" font-size="13" font-weight="bold" fill="#333">EXTERNAL</text>
<rect x="905" y="365" width="170" height="60" rx="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="990.0" y="383.0" font-size="11" text-anchor="middle">Push Notification</text>
<text x="990.0" y="399.0" font-size="11" text-anchor="middle">Service (Web Push / FCM,</text>
<text x="990.0" y="415.0" font-size="11" text-anchor="middle">simulated in lab)</text>
<rect x="905" y="435" width="170" height="52" rx="6" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="990.0" y="457.0" font-size="11" text-anchor="middle">Email / SMS (optional)</text>
<text x="990.0" y="473.0" font-size="11" text-anchor="middle">not in scope</text>
<line x1="840" y1="378" x2="905" y2="395" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="848" y="377.5" width="32.8" height="16" fill="#fff"/><text x="852" y="389.5" font-size="11" font-style="italic">push</text>
<polyline points="935,94 935,108 875,108 875,446 842,446" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="882" y="300" font-size="11" font-style="italic" transform="rotate(-90 882 300)">runs periodically</text>
<text x="40" y="660" font-size="11.5">Request flow: Actor → React UI → Express API (auth + validation) → service module → MongoDB. Notification Service pushes alerts to shelters within 5 km (NFR-001).</text>
<text x="40" y="678" font-size="11.5">Expiry Timer System periodically calls the Expiry Scheduler so expired batches leave the claim board. Dashed grey box = third-party service.</text>
</svg>