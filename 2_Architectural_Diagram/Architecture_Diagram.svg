<text x="440.0" y="81.0" font-size="13" text-anchor="middle" font-weight="bold">Shelter Coordinator</text>
<rect x="590" y="60" width="200" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="690.0" y="81.0" font-size="13" text-anchor="middle" font-weight="bold">Network Administrator</text>
<rect x="840" y="60" width="190" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="935.0" y="73.0" font-size="11.5" text-anchor="middle">Expiry Timer System</text>
<text x="935.0" y="89.0" font-size="11.5" text-anchor="middle">(scheduled job)</text>
<rect x="40" y="115" width="820" height="85" rx="8" fill="#eaf2fb" stroke="#2E5E8C" stroke-width="1.5"/>
