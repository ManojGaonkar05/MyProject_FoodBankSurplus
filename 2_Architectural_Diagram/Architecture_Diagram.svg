<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#333"/></marker></defs>
<rect width="1120" height="700" fill="#fff"/>
<text x="40" y="28" font-size="18" font-weight="bold">Architecture Diagram – Food Bank Surplus Redistribution Platform</text>
<text x="40" y="46" font-size="12" fill="#555">Style: layered (3-tier) modular architecture. Technologies shown are proposed, not mandated by the problem statement.</text>
<rect x="90" y="60" width="200" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
