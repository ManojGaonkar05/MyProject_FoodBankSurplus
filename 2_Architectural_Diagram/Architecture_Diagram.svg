<rect x="55" y="140" width="185" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="147.5" y="160.0" font-size="11.5" text-anchor="middle">Donor Dashboard</text>
<text x="147.5" y="176.0" font-size="11.5" text-anchor="middle">post / track batches</text>
<rect x="255" y="140" width="185" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
